<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="고민지 기말" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>고민지 기말 화이팅 !</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div class="title-area">
          <div class="title-row">
            <h1>고민지 기말 화이팅 !</h1>
            <div class="study-timer" aria-label="공부 타이머">
              <strong id="timerDisplay">00:00:00</strong>
              <button id="timerStartBtn" type="button">공부 시작</button>
              <button id="timerEndBtn" type="button">끝</button>
            </div>
          </div>
          <p id="sourceMeta">문제를 불러오는 중</p>
          <p id="timerLog" class="timer-log">아직 기록된 공부 시간이 없습니다.</p>
        </div>
        <div class="stats" aria-label="풀이 현황">
          <span><b id="totalCount">0</b> 전체</span>
          <span><b id="correctCount">0</b> 맞힘</span>
          <span><b id="wrongCount">0</b> 오답</span>
        </div>
      </section>

      <nav id="subjectTabs" class="subject-tabs" aria-label="과목 선택"></nav>
      <nav id="categoryTabs" class="category-tabs" aria-label="카테고리 선택"></nav>
      <section id="chapterProgress" class="chapter-progress" aria-label="챕터별 진행률"></section>

      <nav class="tabs" aria-label="문제 묶음">
        <button data-mode="due" class="active">풀 문제</button>
        <button data-mode="wrong">틀린 문제</button>
        <button data-mode="correct">맞힌 문제</button>
        <button data-mode="favorite">즐겨찾기</button>
        <button data-mode="all">전체</button>
      </nav>

      <section class="quiz">
        <div class="quiz-head">
          <span id="progressLabel">-</span>
          <div class="quiz-tools">
            <button id="favoriteBtn" type="button">☆ 즐겨찾기</button>
            <button id="shuffleBtn" type="button">섞기</button>
            <button id="choiceShuffleBtn" type="button">보기 섞기</button>
          </div>
        </div>

        <article class="question">
          <div id="questionText" class="stem"></div>
          <div id="choices" class="choices"></div>
          <div id="answerBox" class="answer hidden"></div>
        </article>

        <div class="actions">
          <button id="showAnswerBtn" type="button">정답 보기</button>
          <button id="explanationBtn" type="button">해설 보기</button>
          <button id="markWrongBtn" type="button">틀렸음</button>
          <button id="markCorrectBtn" type="button">맞혔음</button>
          <button id="prevBtn" type="button">이전</button>
          <button id="nextBtn" type="button">다음</button>
        </div>
        <div id="explanationBox" class="explanation-box hidden"></div>
      </section>

      <section class="list-panel">
        <div class="list-head">
          <strong id="listTitle">문제 목록</strong>
          <button id="resetBtn" type="button">기록 초기화</button>
        </div>
        <div id="questionList" class="question-list"></div>
      </section>
    </main>

    <script src="./questions-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
